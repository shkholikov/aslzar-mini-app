name: claude-review

# PR review by Anthropic's official code-review plugin (claude-plugins-official), run by Opus:
# four reviewers in parallel, every finding re-checked by its own agent, only confirmed ones
# posted as inline comments; "No issues found" as one comment otherwise.
# One review per PR: it runs when a PR opens (or is reopened, or leaves draft), and this
# workflow skips a PR Claude has already reviewed. A run that failed or was cut off leaves a
# "failed" note, and reopening the PR then reviews it again. The main check happens before the PR,
# in /verify on the developer's machine.
#
# The PR that adds or changes this file gets no Claude review: the action skips a run whose
# workflow file differs from the default branch's. Every later PR is reviewed.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    # Fork PRs get no secrets, and the action refuses to run for a bot actor (Dependabot, Renovate).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # The PR's current head. The action then restores the root CLAUDE.md and .claude/ from the
      # base branch and puts its own app token (contents and pull-requests write) in the origin
      # URL, so the tool rules below, not this checkout, limit what the session can do.
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 1
          persist-credentials: false

      # One review per PR, decided here and not by the model: the plugin's own test reads
      # `gh pr view --comments`, which hides reviews made only of inline comments.
      # Reviewed = claude[bot] has commented AND no failure note from this workflow is open
      # (a run that failed or was cut off leaves one, so reopening the PR reviews it again).
      # Also notes the start time: comments posted after it belong to this run.
      - name: Has Claude already reviewed this PR
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          at=$(date -u -d '-30 seconds' +%Y-%m-%dT%H:%M:%SZ)
          echo "at=$at" >>"$GITHUB_OUTPUT"

          mine='.[] | select(.user.login == "claude[bot]") | .id'
          a=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq "$mine")
          b=$(gh api --paginate "repos/$REPO/pulls/$PR/comments" --jq "$mine")
          n=$(printf '%s\n%s\n' "$a" "$b" | grep -c . || true)
          failed=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- claude-review-note:failed -->"))) | .id' |
            grep -c . || true)
          if [ "$n" -gt 0 ] && [ "$failed" -eq 0 ]; then
            echo "reviewed=true" >>"$GITHUB_OUTPUT"
            echo "::notice::Claude already reviewed this PR ($n comment(s)). One review per PR."
          else
            echo "reviewed=false" >>"$GITHUB_OUTPUT"
            [ "$failed" -eq 0 ] || echo "::notice::The last review run failed or was cut off; reviewing again."
          fi

      # Pinned to a release commit: the v1 tag moves and has changed behaviour without notice.
      # Bump it deliberately, through this template.
      - uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1.0.278
        id: claude
        if: steps.prior.outputs.reviewed == 'false'
        # A headless run ends when Claude ends its turn, which kills background subagents: the
        # model launched the review agents in the background, said "waiting", and nothing was
        # posted (claude-code-action#1462). This makes every Agent call run in the foreground.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # or: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: >-
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
            Also: treat REVIEW.md at the repository root, if it exists, as a CLAUDE.md file that applies to every file.
          # The review only reads and comments. The allow list pre-approves what the plugin uses;
          # the deny list blocks the usual write commands outright. Anything else goes to the
          # action's auto-mode classifier, so this is a guard, not a sandbox.
          # --append-system-prompt passes straight to the CLI: the action sets no appended
          # prompt of its own (parse-sdk-options.ts at the pinned commit).
          claude_args: |
            --model claude-opus-5-5
            --append-system-prompt "This is a one-shot CI run: ending your turn ends the run and kills any background work, and you will never be re-invoked or notified. Run every Agent call in the foreground and wait for its result; several calls in one message still run in parallel. Do not end your turn until the review is posted. If the code-review command stops before reviewing (PR closed, draft, trivial, automated or already reviewed), end your final message with one line: REVIEW-SKIPPED: followed by the reason."
            --allowedTools "Agent,Task,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,NotebookEdit,Bash(git push:*),Bash(git commit:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(gh pr ready:*),ScheduleWakeup,Monitor,SendMessage,CronCreate"

      # Green when the Claude step succeeded and Claude posted in this run (inline comments or a
      # PR comment), or skipped the PR on purpose (last line REVIEW-SKIPPED; the reason is posted).
      # Red otherwise, with a "failed" note on the PR, which makes the next reopen review again.
      # Not run when the PR was already reviewed.
      - name: Check the review was posted
        if: always() && steps.claude.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.prior.outputs.at }}
          OUTCOME: ${{ steps.claude.outcome }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          # This workflow's own PR notes: removed before a new one, and after a good review.
          clear_notes() {
            local ids id
            ids=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- claude-review-note"))) | .id') ||
              { echo "::warning::Could not list earlier review notes."; return 0; }
            for id in $ids; do
              gh api -X DELETE "repos/$REPO/issues/comments/$id" >/dev/null ||
                echo "::warning::Could not delete earlier review note $id."
            done
          }
          note() { # $1 = failed | skipped; the body comes on stdin
            local body
            body=$(cat)
            clear_notes
            printf '<!-- claude-review-note:%s -->\n%s\n' "$1" "$body" >"$RUNNER_TEMP/note.md"
            gh pr comment "$PR" -R "$REPO" --body-file "$RUNNER_TEMP/note.md"
          }
          quote() { # first 6000 bytes, cut on a whole UTF-8 character, as a quote block
            { printf '%s\n' "${1:-(empty)}" | head -c 6000 | iconv -f UTF-8 -t UTF-8 -c | sed 's/^/> /'; } || true
          }

          # The action skips a PR that changes this file (it must match the default branch's).
          wf=.github/workflows/claude-review.yml
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -qxF "$wf" <<<"$files"; then
            echo "::notice::This PR changes claude-review.yml, so it gets no Claude review; the next PR does."
            exit 0
          fi

          since=".created_at >= \"$SINCE\" and .user.login == \"claude[bot]\""
          issue=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq ".[] | select($since) | .id" | wc -l | tr -d ' ')
          inline=$(gh api --paginate "repos/$REPO/pulls/$PR/comments" --jq ".[] | select($since) | .id" | wc -l | tr -d ' ')
          echo "claude[bot] posted $issue PR comment(s) and $inline inline comment(s) in this run. Claude step: $OUTCOME."

          # Which subagents the review used (the plugin asks for haiku, sonnet and opus agents).
          log=${EXEC_FILE:-$RUNNER_TEMP/claude-execution-output.json}
          if [ -s "$log" ]; then
            jq -r '
              [.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use" and (.name == "Agent" or .name == "Task")) | .input] as $a
              | "Subagents launched: \($a | length)",
                ($a[] | "  - \(.model // "default"): \(.description // .subagent_type // "?")"),
                "Models used: \([.[] | select(.type == "result") | .modelUsage // {} | keys[]] | unique | join(", "))"
            ' "$log" 2>/dev/null || echo "Could not read the subagent list from the run log."
          fi

          if [ "$issue" -gt 0 ] || [ "$inline" -gt 0 ]; then
            if [ "$OUTCOME" = success ]; then
              clear_notes
              exit 0
            fi
            # Some comments, then the step failed or timed out: the review may be partial.
            echo "The review was cut off: Claude posted $issue PR comment(s) and $inline inline comment(s), then its step ended with \"$OUTCOME\". The review may be incomplete. Close and reopen the PR to review it again." |
              note failed
            echo "::error::The review was cut off after posting some comments. Close and reopen the PR to review it again."
            exit 1
          fi

          # Nothing posted. Without a run log the action never started the review.
          if [ ! -s "$log" ]; then
            if [ "$OUTCOME" = success ]; then
              msg="The action skipped this run: its workflow file differs from the default branch's (an old re-run, or the PR's base is not the default branch). Close and reopen the PR."
            else
              msg="The Claude step failed before the review started; see its log (secret missing, Claude GitHub App not installed on this repo, or a timeout). Fix that, then close and reopen the PR."
            fi
            echo "$msg" | note failed
            echo "::error::$msg"
            exit 1
          fi

          # Claude's last message says why. A deliberate skip ends with the REVIEW-SKIPPED line.
          full=$(jq -r '[.[] | select(.type == "result")] | last | (.result // ((.errors // []) | map(tostring) | join("; ")))' "$log" 2>/dev/null) ||
            full=''
          lastline=$(printf '%s\n' "$full" | sed '/^[[:space:]]*$/d' | tail -n 1 | tr -d '*`' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//') || lastline=''
          if [ "$OUTCOME" = success ] && [[ "$lastline" =~ ^REVIEW-SKIPPED:[[:space:]]*(.+)$ ]]; then
            reason=${BASH_REMATCH[1]}
            echo "Claude skipped the review of this PR: $reason" | note skipped
            echo "::notice::Claude skipped this PR on purpose: $reason"
            exit 0
          fi
          {
            echo "The review workflow failed (this note is from the workflow, not from Claude, and is not a review). Claude step: $OUTCOME. Claude's last message:"
            echo
            quote "$full"
          } | note failed
          echo "::error::Claude did not post a review; its last message is on the PR. Close and reopen the PR to try again."
          exit 1
