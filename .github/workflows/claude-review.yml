name: claude-review

# PR review by Anthropic's official code-review plugin (claude-plugins-official), run by Opus:
# four reviewers in parallel, every finding re-checked by its own agent, only confirmed ones
# posted as inline comments; "No issues found" as one comment otherwise.
# Runs once when a PR opens (or is reopened, or leaves draft). The plugin skips a PR Claude has
# already commented on, so a second round needs a new PR. The main check happens before the
# PR, in /verify on the developer's machine.
#
# The PR that adds or changes this file gets no Claude review: the action skips a run whose
# workflow file differs from the default branch's. Every later PR is reviewed.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    # Fork PRs get no secrets, and the action refuses to run for a bot actor (Dependabot, Renovate).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # The PR's current head (CLAUDE.md and the code the agents read). No token is left in
      # .git/config for the model to find.
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 1
          persist-credentials: false

      # Comments the bot posts after this moment belong to this run.
      - name: Note the start time
        id: start
        run: echo "at=$(date -u -d '-30 seconds' +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # or: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: >-
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
            Also: treat REVIEW.md at the repository root, if it exists, as a CLAUDE.md file that applies to every file.
            If you stop before reviewing (closed, draft, trivial, or already reviewed), still post one
            short comment with gh pr comment that says why.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Agent,Task,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"

      # Green only when the bot posted something in this run: inline comments or a PR comment.
      - name: Check the review was posted
        if: steps.claude.outputs.skipped_due_to_workflow_validation_mismatch != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.at }}
        run: |
          set -euo pipefail
          sel=".[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$SINCE\") | .id"
          issue=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq "$sel" | wc -l | tr -d ' ')
          inline=$(gh api --paginate "repos/$REPO/pulls/$PR/comments" --jq "$sel" | wc -l | tr -d ' ')
          echo "claude[bot] posted $issue PR comment(s) and $inline inline comment(s) in this run."
          if [ "$issue" -eq 0 ] && [ "$inline" -eq 0 ]; then
            echo "::error::Claude posted nothing in this run. Close and reopen the PR to try again."
            exit 1
          fi
