name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # admin has 13 lint errors and webapp 48 today. Remove continue-on-error once they reach 0.
      - run: pnpm lint
        continue-on-error: true
      # The Next.js apps are built by Vercel on every PR, so CI builds only api and bot.
      - run: pnpm --filter ./apps/api --filter ./apps/bot build
